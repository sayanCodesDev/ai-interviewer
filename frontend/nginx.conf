# Serves the built site (frontend/dist) the way public/_redirects describes: prerendered pages are real files,
# app routes get the empty app shell, and anything else is a genuine 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/nginx-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 512;

    # Content-hashed build output can be cached forever. Headers set in a location replace the inherited ones, so re-include them.
    location ~ ^/(chunk-|font-) {
        include /etc/nginx/nginx-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /monaco/ {
        include /etc/nginx/nginx-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # The signed-in app: one empty shell, rendered by the browser.
    location ~ ^/(signin|signup|dashboard|setup|form|interview|result)$ { rewrite ^ /app.html break; }
    location ~ ^/(lobby|interview|report)/ { rewrite ^ /app.html break; }

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/nginx-headers.conf;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
